    <!--
      舊的 HashRouter 連結相容層：把 /#/about 轉成 /about。
      必須放在 app script 之前，才不會先閃一下錯的頁面。
    -->
    <script>
      (function () {
        var h = window.location.hash
        if (h.indexOf('#/') === 0) {
          var target = h.slice(1)
          window.history.replaceState(null, '', target === '/' ? '/' : target)
        }
      })()
    </script>
